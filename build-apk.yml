name: Build APK

# Chạy mỗi khi push lên main, hoặc bấm chạy tay trong tab Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài nền tảng Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cài Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (debug - cài trực tiếp được)
        run: gradle assembleDebug --stacktrace

      - name: Tải APK lên để bạn download
        uses: actions/upload-artifact@v4
        with:
          name: truyen-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
