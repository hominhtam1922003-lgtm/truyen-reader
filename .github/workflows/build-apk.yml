name: Build APK

# Chạy mỗi khi push lên main, hoặc bấm chạy tay trong tab Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Ghim bản Ubuntu ổn định, tránh bản mới nhất đang chuyển đổi gây lỗi lạ
    runs-on: ubuntu-24.04
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Kiểm tra Android SDK có sẵn trên máy chạy
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cài Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (debug - cài trực tiếp được)
        run: gradle assembleDebug --stacktrace

      - name: Tải APK lên để bạn download
        uses: actions/upload-artifact@v4
        with:
          name: truyen-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
